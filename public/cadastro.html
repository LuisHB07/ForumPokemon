<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokeTeam - Cadastro</title>
    <script src="js/sessao.js"></script>
    <link rel="stylesheet" href="styles/cadastro.css">
</head>
<body>
    <div class="main">
        <div class="card-tematico">
            <div class="pokedex">
                <div class="bola azul"></div>
                <div class="bola vermelha"></div>
                <div class="bola amarela"></div>
            </div>
            <img src="https://media.tenor.com/lr6evdW49pcAAAAj/totodile-pokemon.gif" alt="">
            <p>Participe da melhor comunidade de Pokémon do Brasil!</p>
        </div>
        <div class="card-formulario">
            <a href="index.html" class="seta-home"><- Voltar</a>
                    <div class="formulario">
                        <h2>Cadastre-se</h2>
                        <input type="text" id="ipt_nome" placeholder="Nome">
                        <input type="text" id="ipt_email" placeholder="Email">
                        <input type="password" id="ipt_senha" placeholder="Senha">
                        <input type="password" id="ipt_confirmar" placeholder="Confirmar Senha">
                        <div class="possui-conta">
                            Já possui uma conta?<a href="login.html"> Faça login</a>
                        </div>
                        <button onclick="cadastrar()">Registrar</button>
                    </div>
                    <div id="div_mensagem_erro" class="mensagem-erro"></div>
        </div>
        <div id="div_aguardar" class="loading-div">
            <img src="assets/img/carregando.gif" id="loading-gif" />
        </div>
    </div>
</body>

</html>
<script>
    let temEspecial = false
    function cadastrar() {
        aguardar();

        //Recupere o valor da nova input pelo nome do id
        // Agora vá para o método fetch logo abaixo
        let nomeVar = ipt_nome.value;
        let emailVar = ipt_email.value;
        let senhaVar = ipt_senha.value;
        let confirmacaoSenhaVar = ipt_confirmar.value;
        let listaEspecial = ['!', '@', '#', '$', '%', '^', '&', '*', '(', ')', '-', '_', '=', '+']

        // Verificando se há algum campo em branco
        if (
            nomeVar == "" ||
            emailVar == "" ||
            senhaVar == "" ||
            confirmacaoSenhaVar == ""
        ) {
            div_mensagem_erro.innerHTML = `<span style="color: red;">(Preencha todos os campos!)</span>`
            finalizarAguardar();
            return false;
        }

        if (emailVar.includes('@') == false || emailVar.includes('.') == false) {
            div_mensagem_erro.innerHTML = `<span style="color: red;">Insira um email válido</span>`
            finalizarAguardar();
            return false;
        }

        if (senhaVar.length < 8) {
            div_mensagem_erro.innerHTML = `<span style="color: red;">Sua senha precisa ter no mínimo 8 caracteres</span>`
            finalizarAguardar();
            return false;
        } if (senhaVar == senhaVar.toUpperCase()) {
            div_mensagem_erro.innerHTML = '<span style="color: red;">A senha precisa conter ao menos uma letra minúscula</span>'
            finalizarAguardar();
            return false;
        }
        if (senhaVar == senhaVar.toLowerCase()) {
            div_mensagem_erro.innerHTML = '<span style="color: red;">A senha precisa conter ao menos uma letra maiúscula</span>'
            finalizarAguardar();
            return false;
        }
        for (let i = 0; i < senhaVar.length; i++) {
            if (listaEspecial.includes(senhaVar[i])) {
                temEspecial = true
            }
        }
        if (temEspecial == false) {
            div_mensagem_erro.innerHTML = '<span style="color: red;">A senha precisa conter ao menos um caractere especial</span>'
            finalizarAguardar();
            return false;
        }
        if (senhaVar != confirmacaoSenhaVar) {
            div_mensagem_erro.innerHTML = '<span style="color: red;">As senhas não coincidem</span>'
            finalizarAguardar();
            return false;
        }
        // Enviando o valor da nova input
        fetch("/usuarios/cadastrar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify({
                // crie um atributo que recebe o valor recuperado aqui
                // Agora vá para o arquivo routes/usuario.js
                nomeServer: nomeVar,
                emailServer: emailVar,
                senhaServer: senhaVar,
            }),
        })
            .then(function (resposta) {
                console.log("resposta: ", resposta);

                if (resposta.ok) {

                    div_mensagem_erro.innerHTML =
                        "Cadastro realizado com sucesso! Redirecionando para tela de Login...";

                    setTimeout(() => {
                        window.location = "login.html";
                    }, 2000);
                    finalizarAguardar();
                } else {
                    div_mensagem_erro.innerHTML = `<span style="color: red;">Esse email já possui um cadastro!</span>`
                    finalizarAguardar();
                    return false;
                    throw "Houve um erro ao tentar realizar o cadastro!";
                }
            })
            .catch(function (resposta) {
                console.log(`#ERRO: ${resposta}`);
                finalizarAguardar();
            });

        return false;
    }
</script>
