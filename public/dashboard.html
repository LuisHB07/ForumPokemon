<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokeTeam - Dashboard</title>
    <script src="js/sessao.js"></script>
    <link rel="stylesheet" href="styles/logado.css">
    <link rel="stylesheet" href="styles/dashboard.css">
</head>
<body>
    <div class="pagina">
        <div id="barra_lateral" class="barra-lateral">
            <ul class="lista-paginas">
                <a href="forum.html"><img src="https://cdn-icons-png.flaticon.com/512/6456/6456117.png">Fórum</a>
                <a href="times.html"><img src="https://cdn.iconscout.com/icon/premium/png-256-thumb/pokebola-icon-svg-download-png-4399494.png">Seus times</a>
                <a><img src="https://www.iconpacks.net/icons/1/free-chart-icon-646-thumb.png"><b>Dashboard</b></a>
            </ul>
            <div class="usuario">
                <img src="https://uxwing.com/wp-content/themes/uxwing/download/peoples-avatars/account-white-icon.png">
                <p id="nome_usuario"></p>
            </div>
            <button onclick="limparSessao()" class="botao-sair">Sair</button>
        </div>
        <button id="botao_alternar" class="botao-alternar" onclick="alternarBarra()"><-</button>
        <div class="conteudo">
            <div class="titulo-dash">
                <h2>Time atual - Time1</h2><img class="seta" src="assets/img/setaTime.png" alt="">
            </div>
            <div class="kpis">
                <div class="card">
                    <p>Tipo que mais aparece no seu time</p>
                    <div class="conteudoKpi">
                        <img class="kpiImg" src="">
                        <h3>Água</h3>
                    </div>
                </div>
                <div class="card">
                    <p></p>
                    <div class="conteudoKpi">
                        <img class="kpiImg" src="">
                        <h3>B</h3>
                    </div>
                </div>
                <div class="card">
                    <p>C</p>
                    <div class="conteudoKpi">
                        <img class="kpiImg" src="">
                        <h3>C</h3>
                    </div>
                </div>
                <div class="card">
                    <p>D</p>
                    <div class="conteudoKpi">
                        <img class="kpiImg" src="">
                        <h3>D</h3>
                    </div>
                </div>
            </div>
            <div class="graficos">

            </div>
        </div>
    </div>
</body>
</html>
<script>
    nome_usuario.innerHTML += sessionStorage.NOME_USUARIO
    
    function alternarBarra(){
    barra_lateral.classList.toggle("fechada");
    if(barra_lateral.classList.contains("fechada")){
        botao_alternar.innerHTML = '->'
    }else{
        botao_alternar.innerHTML = '<-'
    }
}
</script>
