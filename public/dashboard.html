<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokeTeam - Dashboard</title>
    <script src="js/sessao.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="styles/logado.css">
    <link rel="stylesheet" href="styles/dashboard.css">
</head>
<body>
    <div class="pagina">
        <div id="barra_lateral" class="barra-lateral">
            <div class="lista-botao">
                <div class="botao-lateral">
                <img style="height: 70px; width: 60px;" src="assets/img/forum.png"><button onclick="window.location.href='forum.html'">Fórum</button>
                </div>
                <div class="botao-lateral">
                <img src="https://images-wixmp-ed30a86b8c4ca887773594c2.wixmp.com/f/581e2efc-8fab-47ca-9536-3770aab24ea4/d2joc5j-c2562d13-9dbe-4747-b70b-03e25d3abb80.png?token=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJ1cm46YXBwOjdlMGQxODg5ODIyNjQzNzNhNWYwZDQxNWVhMGQyNmUwIiwiaXNzIjoidXJuOmFwcDo3ZTBkMTg4OTgyMjY0MzczYTVmMGQ0MTVlYTBkMjZlMCIsIm9iaiI6W1t7InBhdGgiOiIvZi81ODFlMmVmYy04ZmFiLTQ3Y2EtOTUzNi0zNzcwYWFiMjRlYTQvZDJqb2M1ai1jMjU2MmQxMy05ZGJlLTQ3NDctYjcwYi0wM2UyNWQzYWJiODAucG5nIn1dXSwiYXVkIjpbInVybjpzZXJ2aWNlOmZpbGUuZG93bmxvYWQiXX0.M5BKKzoIcABgqjReFoFKDyQ8bOKYTFr00I3cN-Y9wNs"><button onclick="window.location.href='times.html'">Seus times</button>
                </div>
                <div class="botao-lateral">
                    <img src="assets/img/dashboard.png"><button><b>Dashboard</b></button>
                </div>
            </div>
            <div class="usuario">
                <img src="https://uxwing.com/wp-content/themes/uxwing/download/peoples-avatars/account-white-icon.png">
                <p id="nome_usuario"></p>
            </div>
            <button onclick="limparSessao()" class="botao-sair">Sair</button>
        </div>
        <button id="botao_alternar" class="botao-alternar" onclick="alternarBarra()"><-</button>
        <div class="conteudo">
            <div class="titulo-dash">
                <h2>Dashboard - seus times</h2>
            </div>
            <div class="kpis">
                <div class="card">
                    <p>Tipo que mais aparece nos seus times:</p>
                    <div class="conteudoKpi">
                        <img class="kpiImg" src="">
                        <h3 id="kpi_tipo"></h3>
                    </div>
                </div>
                <div class="card">
                    <p>Categoria de ataque que mais aparece nos seus times:</p>
                    <div class="conteudoKpi">
                        <img class="kpiImg" src="">
                        <h3 id="kpi_categoria"></h3>
                    </div>
                </div>
                <div class="card">
                    <p>Seu dia da semana com mais posts:</p>
                    <div class="conteudoKpi">
                        <img class="kpiImg" src="">
                        <h3 id="kpi_dia"></h3>
                    </div>
                </div>
                <div class="card">
                    <p>Pokemon que mais aparece nos times da comunidade</p>
                    <div class="conteudoKpi">
                        <img class="kpiImg" src="">
                        <h3 id="kpi_pokemon"></h3>
                    </div>
                </div>
            </div>
            <div class="graficos">
                <div class="grafico grafico-pizza">
                    <h3>Categorias de ataque</h3>
                    <canvas id="grafico_categorias"></canvas>
                </div>
                <div class="grafico">
                    <h3>Posts por dia da semana</h3>
                    <canvas id="grafico_posts"></canvas>
                </div>
                <div class="grafico">
                    <h3>Tipos de Pokémon nos seus times</h3>
                    <canvas id="grafico_tipos"></canvas>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
<script>
    nome_usuario.innerHTML += sessionStorage.NOME_USUARIO

    function alternarBarra(){
        barra_lateral.classList.toggle("fechada");
        if(barra_lateral.classList.contains("fechada")){
            botao_alternar.innerHTML = '->'
        }else{
            botao_alternar.innerHTML = '<-'
        }
    }
    function carregarDashboard(){
        var idUsuario = sessionStorage.ID_USUARIO
        carregarTipos(idUsuario)
        carregarPostsPorDia(idUsuario)
        carregarCategorias(idUsuario)
        carregarPokemonMaisUsado()
    }
    function carregarTipos(idUsuario){
        fetch(`/dashboard/tipos/${idUsuario}`, { method: "GET" })
        .then(function(resposta){
            resposta.json().then(function(lista){
                var labels = []
                var quantidades = []
                for(let i = 0; i < lista.length; i++){
                    labels.push(lista[i].tipo)
                    quantidades.push(lista[i].quantidade)
                }
                const data1 = {
                    labels: labels,
                    datasets: [{
                        label: 'Quantidade',
                        data: quantidades,
                        backgroundColor: ['blue', 'red', 'yellow', 'purple', 'darkred', 'black', 'green', 'orange', 'pink', 'brown', 'gray', 'cyan', 'lime', 'magenta', 'gold', 'silver', 'navy', 'teal']
                    }]
                }
                const config1 = { type: 'bar', data: data1, options: {} }
                new Chart(document.getElementById('grafico_tipos'), config1)
                // KPI - tipo que mais aparece
                if(lista.length > 0){
                    document.getElementById('kpi_tipo').innerHTML = lista[0].tipo
                }
            })
        })
    }
    function carregarPostsPorDia(idUsuario){
        fetch(`/dashboard/posts/${idUsuario}`, { method: "GET" })
        .then(function(resposta){
            resposta.json().then(function(lista){
                var labels = []
                var quantidades = []
                var dias = {
                    "Monday": "Segunda",
                    "Tuesday": "Terça",
                    "Wednesday": "Quarta",
                    "Thursday": "Quinta",
                    "Friday": "Sexta",
                    "Saturday": "Sabádo",
                    "Sunday": "Domingo"
                }
                for(let i = 0; i < lista.length; i++){
                    labels.push(dias[lista[i].dia])
                    quantidades.push(lista[i].quantidade)
                }
                const data2 = {
                    labels: labels,
                    datasets: [{
                        label: 'Posts',
                        data: quantidades,
                        borderColor: 'red',
                        backgroundColor: 'rgba(255,0,0,0.1)',
                        fill: true,
                        tension: 0.4
                    }]
                }
                const config2 = { type: 'line', data: data2, options: {} }
                new Chart(document.getElementById('grafico_posts'), config2)
                // KPI - dia com mais posts
                if(lista.length > 0){
                    document.getElementById('kpi_dia').innerHTML =  dias[lista[0].dia]
                }
            })
        })
    }
    function carregarCategorias(idUsuario){
        fetch(`/dashboard/categorias/${idUsuario}`, { method: "GET" })
        .then(function(resposta){
            resposta.json().then(function(lista){
                var labels = []
                var quantidades = []
                for(let i = 0; i < lista.length; i++){
                    labels.push(lista[i].categoria)
                    quantidades.push(lista[i].quantidade)
                }
                const data3 = {
                    labels: labels,
                    datasets: [{
                        data: quantidades,
                        backgroundColor: ['red', 'blue', 'yellow']
                    }]
                }
                const config3 = { type: 'pie', data: data3, options: {} }
                new Chart(document.getElementById('grafico_categorias'), config3)
                // KPI - categoria que mais aparece
                if(lista.length > 0){
                    document.getElementById('kpi_categoria').innerHTML = lista[0].categoria
                }
            })
        })
    }
    function carregarPokemonMaisUsado(){
        fetch(`/dashboard/comunidade`, { method: "GET" })
        .then(function(resposta){
            resposta.json().then(function(lista){
                if(lista.length > 0){
                    document.getElementById('kpi_pokemon').innerHTML = lista[0].nome
                }
            })
        })
    }
carregarDashboard()
</script>
