<script>
    nome_usuario.innerHTML += sessionStorage.NOME_USUARIO
    
    function alternarBarra(){
    barra_lateral.classList.toggle("fechada");
    if(barra_lateral.classList.contains("fechada")){
        botao_alternar.innerHTML = '->'
    }else{
        botao_alternar.innerHTML = '<-'
    }
    }
    function criarTime(){
        janela.style.display = "flex"
    }
    function fecharJanela(){
        janela.style.display = "none"
    }

    function salvarTime(){

        let dados = {
        nomeTime: ipt_nome_time.value,

        nomePokemon1: ipt_nome_pokemon1.value,
        nomePokemon2: ipt_nome_pokemon2.value,
        
        tipagem1Pokemon1: sel_tipo1_pokemon1.value,
        tipagem2Pokemon1: sel_tipo2_pokemon1.value,
        
        tipagem1Pokemon2: sel_tipo1_pokemon2.value,
        tipagem2Pokemon2: sel_tipo2_pokemon2.value,
        
        nomeAtaquePokemon1: ipt_ataque1_pokemon1.value,
        nomeAtaquePokemon2: ipt_ataque1_pokemon2.value,
        
        tipoAtaquePokemon1: sel_tipoataque1_pokemon1.value,
        tipoAtaquePokemon2: sel_tipoataque1_pokemon2.value,
        
        categoriaAtaquePokemon1: sel_categoria1_pokemon1.value,
        categoriaAtaquePokemon2: sel_categoria1_pokemon2.value,

        idUsuario: sessionStorage.ID_USUARIO
        }
        cadastrarEquipe(dados)
}
    function cadastrarEquipe(dados){
        fetch(`/equipes/cadastrar/${dados.idUsuario}`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify({
                nomeServer: dados.nomeTime
            })
        })
        .then(function(resposta){
            resposta.json().then(function(resultado){
                var idEquipe = resultado.insertId
                cadastrarPokemon1(idEquipe, dados)
            })
        })
    }
    
    function cadastrarPokemon1(idEquipe, dados){
        fetch(`/pokemons/cadastrar/${idEquipe}`,{
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify({
                nomeServer: dados.nomePokemon1,
                tipo1Server: dados.tipagem1Pokemon1,
                tipo2Server: dados.tipagem2Pokemon1
            })
        })
        .then(function(resposta){
            resposta.json().then(function(resultado){
                var idPokemon1 = resultado.insertId
                cadastrarAtaquePokemon1(idPokemon1, idEquipe, dados)
            })
            })
    }
    function cadastrarAtaquePokemon1(idPokemon1, idEquipe, dados){
        fetch(`/ataques/cadastrar/${idPokemon1}`,{
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
                nomeServer: dados.nomeAtaquePokemon1,
                tipoServer: dados.tipoAtaquePokemon1,
                categoriaServer: dados.categoriaAtaquePokemon1
            })
        })
            .then(function(resposta){
                resposta.json().then(function(resultado){
                cadastrarPokemon2(idEquipe, dados)
            })
        })
    }

    function cadastrarPokemon2(idEquipe, dados){
        fetch(`/pokemons/cadastrar/${idEquipe}`,{
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            },

            })
        })
        .then(function(resposta){
            resposta.json().then(function(resultado){
                var idPokemon2 = resultado.insertId
                cadastrarAtaquePokemon2(idPokemon2, dados)
            })
        })
    }

    function cadastrarAtaquePokemon2(idPokemon2, dados){
        fetch(`/ataques/cadastrar/${idPokemon2}`,{
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify({
                nomeServer: dados.nomeAtaquePokemon2,
                tipoServer: dados.tipoAtaquePokemon2,
                categoriaServer: dados.categoriaAtaquePokemon2
            })
        })
        .then(function(resposta){
            resposta.json().then(function(resultado){
                console.log("Time salvo com sucesso!")
                alert('Time cadastrado com sucesso!')
                fecharJanela()
                listarTimes()
            })
        })
    }

    function listarTimes(){
        let idUsuario = sessionStorage.ID_USUARIO

        fetch(`/equipes/listar/${idUsuario}`, {
            method: "GET"
        })
        .then(function(resposta){
            resposta.json().then(function(lista){
                var divTimes = document.getElementById("div_times")
                divTimes.innerHTML = ""

                for(let i = 0; i <lista.length; i++){
                    var time = lista[i]

                    var divTime = document.createElement("div")
                    var nomeTime = document.createElement("p")
                    var botaoDeletar = document.createElement("button")
                    var divPokemons = document.createElement("div")

                    nomeTime.innerHTML = time.nome
                    botaoDeletar.innerHTML = "Deletar"
                    botaoDeletar.setAttribute("onclick", `deletarTime(${time.idEquipe})`)
                    botaoDeletar.className = "botao-deletar"
                    divTime.className = "div-time"
                    divPokemons.className = "div-pokemons"

                    divTime.appendChild(nomeTime)
                    divTime.appendChild(divPokemons)
                    divTime.appendChild(botaoDeletar)
                    divTimes.appendChild(divTime)
                    
                    listarPokemonsPorEquipe(time.idEquipe, divPokemons)
                }
            })
        })
    }

    function listarPokemonsPorEquipe(idEquipe, divPokemons){
        fetch(`/pokemons/listar/${idEquipe}`, {
            method: "GET"
        })
        .then (function(resposta){
            resposta.json().then(function(lista){
                for(let i = 0; i < lista.length; i++){
                    var pokemon = lista[i]

                    var divPokemon = document.createElement("div")
                    var nomePokemon = document.createElement("p")

                    nomePokemon.innerHTML = pokemon.nome + " - " + pokemon.tipo1 + " / " + pokemon.tipo2

                    divPokemon.appendChild(nomePokemon)
                    divPokemons.appendChild(divPokemon)

                    listarAtaquesPorPokemon(pokemon.idPokemon, divPokemon)
                }
            })
        })
    }

    function listarAtaquesPorPokemon(idPokemon, divPokemon){
        fetch(`/ataques/listar/${idPokemon}`, {
            method: "GET"
        })
        .then(function(resposta){
            resposta.json().then(function(lista){
                console.log(lista)
                for(let i = 0; i < lista.length; i++){
                    var ataque = lista[i]

                    var pokemonAtaque = document.createElement("p")
                    
                    pokemonAtaque.innerHTML = "Ataque: " + ataque.nome + " - Tipo: " + ataque.tipo + " - Categoria: " + ataque.categoria

                    divPokemon.appendChild(pokemonAtaque)
                }
            })
        })
    }

    function deletarTime(idEquipe){
        fetch(`/equipes/deletar/${idEquipe}`, {
            method: "DELETE",
            headers: {
                "Content-Type": "application/json"
            }
        }).then(function(resposta){

            if(resposta.ok){
                alert('Time deletado com sucesso!')
                listarTimes()
            }else {
                alert('Erro ao deletar o time')
            }
        })
        .catch(function(erro){
            console.log(erro)
        })
    }
    listarTimes()
</script>
