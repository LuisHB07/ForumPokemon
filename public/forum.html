<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokeTeam - Forum</title>
    <script src="js/sessao.js"></script>
    <link rel="stylesheet" href="styles/logado.css">
    <link rel="stylesheet" href="styles/forum.css">
</head>
<body>
    <div class="pagina">
        <div id="barra_lateral" class="barra-lateral">
            <div class="lista-botao">
                <div class="botao-lateral">
                <img style="height: 70px; width: 60px;" src="assets/img/forum.png"><button><b>Fórum</b></button>
                </div>
                <div class="botao-lateral">
                <img src="https://images-wixmp-ed30a86b8c4ca887773594c2.wixmp.com/f/581e2efc-8fab-47ca-9536-3770aab24ea4/d2joc5j-c2562d13-9dbe-4747-b70b-03e25d3abb80.png?token=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJ1cm46YXBwOjdlMGQxODg5ODIyNjQzNzNhNWYwZDQxNWVhMGQyNmUwIiwiaXNzIjoidXJuOmFwcDo3ZTBkMTg4OTgyMjY0MzczYTVmMGQ0MTVlYTBkMjZlMCIsIm9iaiI6W1t7InBhdGgiOiIvZi81ODFlMmVmYy04ZmFiLTQ3Y2EtOTUzNi0zNzcwYWFiMjRlYTQvZDJqb2M1ai1jMjU2MmQxMy05ZGJlLTQ3NDctYjcwYi0wM2UyNWQzYWJiODAucG5nIn1dXSwiYXVkIjpbInVybjpzZXJ2aWNlOmZpbGUuZG93bmxvYWQiXX0.M5BKKzoIcABgqjReFoFKDyQ8bOKYTFr00I3cN-Y9wNs"><button onclick="window.location.href='times.html'">Seus times</button>
                </div>
                <div class="botao-lateral">
                    <img src="assets/img/dashboard.png"><button onclick="window.location.href='dashboard.html'">Dashboard</button>
                </div>
            </div>
            <div class="usuario">
                <img src="https://uxwing.com/wp-content/themes/uxwing/download/peoples-avatars/account-white-icon.png">
                <p id="nome_usuario"></p>
            </div>
            <button onclick="limparSessao()" class="botao-sair">Sair</button>
        </div>
        <button id="botao_alternar" class="botao-alternar" onclick="alternarBarra()"><-</button>
        <div class="conteudo">
            <div class="criar-post">
                <p>Faça sua postagem</p>
                <button onclick="fazerPost()">+ Criar post</button>
            </div>
            <div class="janela" id="janela">
                <div class="conteudo-janela">
                    <button onclick="fecharJanela()" class="botao-fechar">X</button>
                    <div class="conteudo-post">
                        Titulo do post: <input placeholder="Post 1" type="text" id="ipt_titulo"> 
                        Selecione o time que você quer: <select id="select_time_post">
                        </select>
                        Descrição do seu post: <textarea placeholder="Descrição aqui..." id="text_descricao" class="desc-post"></textarea>
                    </div>
                    <button onclick="postar()" class="botao-postar">Fazer post</button>
                </div>
            </div>
            <div class="postagens" id="div_postagens">
            </div>
        </div>
    </div>
</body>
</html>
<script>
    nome_usuario.innerHTML += sessionStorage.NOME_USUARIO
    
    function alternarBarra(){
    barra_lateral.classList.toggle("fechada");
    if(barra_lateral.classList.contains("fechada")){
        botao_alternar.innerHTML = '->'
    }else{
        botao_alternar.innerHTML = '<-'
    }
}
    function fazerPost(){
        janela.style.display = "flex"
        carregarTimesNoSelect()
    }
    function fecharJanela(){
        janela.style.display = "none"
    }

    function carregarTimesNoSelect(){
    var idUsuario = sessionStorage.ID_USUARIO

    fetch(`/equipes/listar/${idUsuario}`, { method: "GET" })
    .then(function(resposta){
        resposta.json().then(function(lista){
            var select = document.getElementById("select_time_post")
            select.innerHTML = ""

            for(let i = 0; i < lista.length; i++){
                var time = lista[i]
                var option = document.createElement("option")
                option.value = time.idEquipe
                option.innerHTML = time.nome
                select.appendChild(option)
            }
        })
    })
}

    function postar(){
        var idUsuario = sessionStorage.ID_USUARIO
        var titulo = ipt_titulo.value
        var descricao = text_descricao.value
        var fkEquipe = select_time_post.value

        fetch(`/posts/publicar/${idUsuario}`, {
            method: "POST",
            headers: { "Content-Type": "application/json"},
            body: JSON.stringify({
                tituloServer: titulo,
                descricaoServer: descricao,
                fkEquipeServer: fkEquipe
            })
        }).then(function(resposta){
            if(resposta.ok){
                alert("Post publicado com sucesso!")
                fecharJanela()
                listarPosts()
            }
        })
    }
    function listarPosts(){
        fetch("/posts/listar",{
            method: "GET"
        }).then(function(resposta){
            resposta.json().then(function(lista){
                var divPostagens = document.getElementById("div_postagens")
                divPostagens.innerHTML = ""

                for(let i = 0; i < lista.length; i++){
                    var post = lista[i]

                    var divPost = document.createElement("div")
                    var titulo = document.createElement("h3")
                    var autor = document.createElement("p")
                    var equipe = document.createElement("p")
                    var descricao = document.createElement("p")
                    var botaoDeletar = document.createElement("button")

                    titulo.innerHTML = post.titulo
                    autor.innerHTML = "Por: " + post.nomeUsuario
                    equipe.innerHTML = "Time: " + post.nomeEquipe
                    descricao.innerHTML = post.descricao
                    if(post.idUsuario == sessionStorage.ID_USUARIO){
                        botaoDeletar.innerHTML = "Deletar"
                        botaoDeletar.setAttribute("onclick", `deletarPost(${post.idPost})`)
                        botaoDeletar.className = "botao-deletar"
                    }else{
                        botaoDeletar.style.display = "none"
                    }
                    var divPokemons = document.createElement("div")
                    divPokemons.className = "div-pokemons"

                    

                    divPost.className = "card-post"
                    divPost.appendChild(titulo)
                    divPost.appendChild(autor)
                    divPost.appendChild(equipe)
                    divPost.appendChild(divPokemons)
                    divPost.appendChild(descricao)
                    divPost.appendChild(botaoDeletar)
                    divPostagens.appendChild(divPost)
                    listarPokemonsPorEquipe(post.fkEquipe, divPokemons)
                    console.log(post)
                }
            })
        })
    }
    function listarPokemonsPorEquipe(idEquipe, divTime){
        fetch(`/pokemons/listar/${idEquipe}`, {
            method: "GET"
        })
        .then (function(resposta){
            resposta.json().then(function(lista){
                for(let i = 0; i < lista.length; i++){
                    var pokemon = lista[i]

                    var divPokemon = document.createElement("div")
                    var nomePokemon = document.createElement("p")
                    divPokemon.className = "pokemon-time"

                    nomePokemon.innerHTML = pokemon.nome + " - " + pokemon.tipo1 + " / " + pokemon.tipo2

                    divPokemon.appendChild(nomePokemon)
                    divTime.appendChild(divPokemon)

                    listarAtaquesPorPokemon(pokemon.idPokemon, divPokemon)
                }

            })
        })
    }

    function listarAtaquesPorPokemon(idPokemon, divPokemon){
        fetch(`/ataques/listar/${idPokemon}`, {
            method: "GET"
        })
        .then(function(resposta){
            resposta.json().then(function(lista){
                console.log(lista)
                for(let i = 0; i < lista.length; i++){
                    var ataque = lista[i]

                    var pokemonAtaque = document.createElement("p")
                    
                    pokemonAtaque.innerHTML = "Ataque: " + ataque.nome + " - Tipo: " + ataque.tipo + " - Categoria: " + ataque.categoria

                    divPokemon.appendChild(pokemonAtaque)
                }
            })
        })
    }
    function deletarPost(idPost){
        fetch(`/posts/deletar/${idPost}`, {
            method: "DELETE",
            headers: { "Content-Type": "application/json"}
        }).then(function(resposta){
            if(resposta.ok){
                alert("Post deletado!")
                listarPosts()
            }
        })
    }


    listarPosts()
</script>
