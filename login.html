<!DOCTYPE html>
<html lang="pt-br">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>PokeTeam - Login</title>
   <link rel="stylesheet" href="styles/login.css">
</head>
<body>
   <div class="main">
      <div class="card-tematico">
            <div class="pokedex">
                <div class="bola azul"></div>
                <div class="bola vermelha"></div>
                <div class="bola amarela"></div>
            </div>
            <img src="https://i.makeagif.com/media/2-16-2016/wu260n.gif" alt="">
            <p>Bem-vindo de volta, Treinador!</p>
        </div>
        <div class="card-formulario">
           <div class="formulario">
               <h2>Entre na conta</h2>
               <input type="text" id="ipt_email" placeholder="Email">
               <input type="password" id="ipt_senha" placeholder="Senha">
               <div class="sem-conta">
                  Ainda não tem uma conta?<a href="cadastro.html"> Cadastre-se</a>
               </div>
               <button onclick="login()">Login</button>
           </div>
        </div>
    </div>
</body>
</html>
<script>
   function login(){
      window.location.href = `index.html`;

   }
</script>
