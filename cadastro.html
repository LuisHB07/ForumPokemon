<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokeTeam - Cadastro</title>
    <link rel="stylesheet" href="styles/cadastro.css">
</head>
<body>
    <div class="main">
        <div class="card-tematico">
            <div class="pokedex">
                <div class="bola azul"></div>
                <div class="bola vermelha"></div>
                <div class="bola amarela"></div>
            </div>
            <img src="https://media.tenor.com/lr6evdW49pcAAAAj/totodile-pokemon.gif" alt="">
            <p>Participe da melhor comunidade de Pokémon do Brasil!</p>
        </div>
        <div class="card-formulario">
            <div class="formulario">
                <h2>Cadastre-se</h2>
                <input type="text" id="ipt_nome" placeholder="Nome">
                <input type="text" id="ipt_email" placeholder="Email">
                <input type="password" id="ipt_senha" placeholder="Senha">
                <input type="password" id="ipt_confirmar" placeholder="Confirmar Senha">
                <div class="possui-conta">
                  Já possui uma conta?<a href="login.html"> Faça login</a>
                </div>
                <button onclick="registrar()">Registrar</button>
            </div>
        </div>
    </div>
</body>
</html>
<script>
    function registrar(){
        window.location.href = `index.html`;
    }
</script>
